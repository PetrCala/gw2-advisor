name: collect

# The cron does not set the sampling rate, collector/poll.py does: GitHub
# delivered only 1.2 of the 6 hourly fires that "*/10" asked for. Each fire
# starts a job that polls six times at 10-minute spacing, and the concurrency group
# below makes a later fire queue and take over when this one ends.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55  # poll.py stops itself just past 50; this is the backstop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python -m collector.poll
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          PYTHONUNBUFFERED: "1"  # otherwise the whole job's log arrives at once at the end
