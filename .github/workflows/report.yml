name: report

# Daily flip report to GitHub Pages, after the 02:40 compaction has run.
# Two jobs on purpose: a job with an environment gets an environment-scoped
# OIDC sub claim, which the AWS role trust (pinned to refs/heads/main) does
# not match. So AWS work happens in build, and only deploy touches Pages.

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pages: write

concurrency:
  group: report

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements-compact.txt
      - run: pip install -r collector/requirements-compact.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python -m report.build
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # First deployments on a fresh Pages site can queue for several minutes.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
