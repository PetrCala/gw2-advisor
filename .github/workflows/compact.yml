name: compact

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to compact (YYYY-MM-DD), defaults to yesterday"
        required: false

permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: compact

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements-compact.txt
      - run: pip install -r collector/requirements-compact.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python -m collector.compact ${{ inputs.day }}
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
      # Scheduled workflows are disabled after 60 days without repo activity.
      # Re-enabling them daily resets that clock.
      - name: keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/compact.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/season.yml/enable"
