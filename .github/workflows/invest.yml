name: invest

# Weekly market-index build over history/dw2/ into invest/bench.json.gz,
# which the daily report renders as the benchmarks page. Single AWS job with
# no environment: an environment-scoped OIDC sub claim would be rejected by
# the AWS role trust (see report.yml).

on:
  schedule:
    - cron: "40 1 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: invest

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements-compact.txt
      - run: pip install -r collector/requirements-compact.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: python -m invest.index
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
